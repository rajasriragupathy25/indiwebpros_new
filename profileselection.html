<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Clone</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Roboto',sans-serif;
}

body{
    background:#141414;
    color:white;
}

/* Profile Screen */
#profilePage{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

h1{
    font-size:60px;
    margin-bottom:50px;
}

.profiles{
    display:flex;
    gap:30px;
    justify-content:center;
    flex-wrap:wrap;
}

.profile{
    cursor:pointer;
    transition:.3s;
}

.profile:hover{
    transform:scale(1.08);
}

.profile img{
    width:180px;
    height:180px;
    border-radius:8px;
    border:3px solid transparent;
}

.profile:hover img{
    border-color:white;
}

.profile p{
    margin-top:15px;
    font-size:22px;
    color:#b3b3b3;
}

.profile:hover p{
    color:white;
}

.manage-btn{
    margin-top:50px;
    padding:12px 35px;
    background:transparent;
    color:#b3b3b3;
    border:1px solid #b3b3b3;
    font-size:18px;
    cursor:pointer;
}

.manage-btn:hover{
    color:white;
    border-color:white;
}

/* Home Screen */
#homePage{
    display:none;
    text-align:center;
    padding-top:100px;
}

.logo{
    color:#E50914;
    font-size:55px;
    font-weight:bold;
    margin-bottom:40px;
}

.movies{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.movie{
    width:220px;
    transition:.3s;
}

.movie img{
    width:100%;
    border-radius:10px;
}

.movie:hover{
    transform:scale(1.08);
}

.movie p{
    margin-top:10px;
    font-size:18px;
}

.logout{
    margin-top:50px;
    padding:12px 30px;
    background:#E50914;
    color:white;
    border:none;
    font-size:18px;
    cursor:pointer;
    border-radius:5px;
}

.logout:hover{
    background:#b00610;
}
</style>
</head>

<body>

<!-- Profile Selection -->
<div id="profilePage">

<div class="container">

<h1>Who's Watching?</h1>

<div class="profiles">

<div class="profile">
<img src="https://i.pravatar.cc/180?img=1">
<p>Sarumathi</p>
</div>

<div class="profile">
<img src="https://i.pravatar.cc/180?img=5">
<p>Kids</p>
</div>

<div class="profile">
<img src="https://i.pravatar.cc/180?img=8">
<p>Guest</p>
</div>

<div class="profile">
<img src="https://i.pravatar.cc/180?img=10">
<p>Add Profile</p>
</div>

</div>

<button class="manage-btn">Manage Profiles</button>

</div>

</div>

<!-- Home Page -->
<div id="homePage">

<div class="logo">NETFLIX</div>

<h2 id="welcome"></h2>

<div class="movies">

<div class="movie">
<img src="https://picsum.photos/220/320?random=1">
<p>Action Movie</p>
</div>

<div class="movie">
<img src="https://picsum.photos/220/320?random=2">
<p>Comedy Movie</p>
</div>

<div class="movie">
<img src="https://picsum.photos/220/320?random=3">
<p>Drama Movie</p>
</div>

<div class="movie">
<img src="https://picsum.photos/220/320?random=4">
<p>Sci-Fi Movie</p>
</div>

</div>

<button class="logout">Back to Profiles</button>

</div>

<script>

const profiles=document.querySelectorAll(".profile");
const profilePage=document.getElementById("profilePage");
const homePage=document.getElementById("homePage");
const welcome=document.getElementById("welcome");

profiles.forEach(profile=>{

profile.addEventListener("click",()=>{

const name=profile.querySelector("p").innerText;

if(name==="Add Profile"){
alert("Add Profile feature coming soon!");
}
else{

welcome.innerHTML="Welcome, "+name+" 👋";

profilePage.style.display="none";
homePage.style.display="block";

}

});

});

document.querySelector(".manage-btn").addEventListener("click",()=>{

alert("Manage Profiles feature coming soon!");

});

document.querySelector(".logout").addEventListener("click",()=>{

homePage.style.display="none";
profilePage.style.display="flex";

});

</script>

</body>
</html>
